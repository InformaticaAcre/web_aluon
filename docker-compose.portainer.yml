services:
  backend:
    image: ${ALUON_BACKEND_IMAGE:-aluon/backend:0.1.0}
    ports:
      - "${BACKEND_PORT:-8011}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: "8080"
      # Para PostgreSQL fuera del stack (host/VM):
      # - En Linux, `host.docker.internal` requiere `extra_hosts` (incluido arriba).
      # - Si prefieres IP directa, sobrescribe `SPRING_DATASOURCE_URL`.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:3000/aluonbbdd}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-aluon}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_DB_SCHEMA: ${APP_DB_SCHEMA:-aluon_web}
      SPRING_FLYWAY_TABLE: ${SPRING_FLYWAY_TABLE:-flyway_schema_history_aluon_web}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://192.168.99.14:8010,https://aluon.iconseriespeliculas.xyz}

  frontend:
    image: ${ALUON_FRONTEND_IMAGE:-aluon/frontend:1.0.0}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8010}:80"
